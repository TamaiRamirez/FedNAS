[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flwr-enas-nofix"
version = "1.0.0"
description = ""
license = "Apache-2.0"
dependencies = [
    "flwr[simulation]>=1.18.0",
    "flwr-datasets[vision]>=0.5.0",
    "tensorflow>=2.11.1,<2.18.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "Tamai Ramirez-Gordillo"

[tool.flwr.app.components]
serverapp = "flwr_enas_nofix.server_app:app"
clientapp = "flwr_enas_nofix.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 8
local-epochs = 40
batch-size = 128
verbose = true
project-path = "/workspace/flwr-enas-nofix/flwr_enas_nofix"
non_iid=false
alpha=1.0
dataset = "uoft-cs/cifar10"
dataset_name = "cifar10"
agg_method = "fedavg"

[tool.flwr.federations]
default = "local-simulation"

[tool.flwr.federations.local-simulation]
options.num-supernodes = 6

[tool.flwr.federations.local-deployment]
address = "127.0.0.1:9093"
insecure = true
