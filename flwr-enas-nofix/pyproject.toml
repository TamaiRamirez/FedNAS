[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flwr-enas-nofix"
version = "1.0.0"
description = ""
license = "Apache-2.0"
dependencies = [
    "flwr[simulation]>=1.26.1",
    "flwr-datasets[vision]>=0.6.0",
    "tensorflow[and-cuda]>=2.15.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "Tamai Ramirez-Gordillo"

[tool.flwr.app.components]
serverapp = "flwr_enas_nofix.server_app:app"
clientapp = "flwr_enas_nofix.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 40
num-nodes = 6
local-epochs = 10
batch-size = 128
verbose = true
project-path = "/workspace/flwr-enas-nofix/flwr_enas_nofix"
non_iid = true
alpha = 0.1
dataset = "uoft-cs/cifar100"  # uoft-cs/cifar10, uoft-cs/cifar100, zalando-datasets/fashion_mnist
dataset_name = "cifar100"              # cifar10, cifar100, fashion_mnist
num-classes = 100
agg_method = "fedavg"
mu = 0.0

